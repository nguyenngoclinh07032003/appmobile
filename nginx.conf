server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers (khai báo ở server cho các phản hồi không qua location có add_header riêng).
    # Lưu ý: add_header KHÔNG kế thừa khi location có add_header riêng -> lặp lại trong từng location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    # File build có hash -> cache lâu
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
        try_files $uri =404;
    }

    # File cài đặt app (APK) - mount từ ./downloads trên VPS vào /usr/share/nginx/download
    # Chỉ phục vụ file trực tiếp (không liệt kê thư mục). Dùng root (không alias):
    # /download/x.apk -> /usr/share/nginx/download/x.apk
    location ^~ /download/ {
        root /usr/share/nginx;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
        try_files $uri =404;

        # Chỉ file .apk mới đổi Content-Type; giữ nguyên bảng MIME mặc định cho các file khác
        location ~* \.apk$ {
            types { }
            default_type application/vnd.android.package-archive;
            add_header Cache-Control "no-cache";
            add_header Content-Disposition "attachment";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
            try_files $uri =404;
        }
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "geolocation=(self), camera=(self)" always;
        try_files $uri $uri/ /index.html;
    }
}
