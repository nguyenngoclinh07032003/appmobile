name: Publish Android preview OTA

on:
  push:
    branches: [main]
    paths:
      - "App.js"
      - "src/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: https://server.hrmss.cyou/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish OTA to preview
        run: >-
          npx eas-cli@latest update
          --channel preview
          --platform android
          --environment preview
          --message "GitHub main ${{ github.sha }}"
          --non-interactive
